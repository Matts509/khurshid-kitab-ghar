<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khurshid Kitab Ghar & Educational Services - Online Portal</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #1e3a8a; /* Deep Navy Blue */
      --accent-color: #f59e0b;  /* Warm Gold */
      --secondary-color: #10b981;/* Emerald Green */
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-main); }

    /* Top Bar & Header */
    .top-banner { background: #0f172a; color: #cbd5e1; font-size: 13px; text-align: center; padding: 6px; }
    header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 30px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    header h1 { font-size: 28px; font-weight: 700; margin-bottom: 5px; }
    header p { opacity: 0.9; font-size: 15px; }

    /* Main Container */
    .main-wrapper { max-width: 1100px; margin: 30px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 340px; gap: 25px; }
    @media (max-width: 850px) { .main-wrapper { grid-template-columns: 1fr; } }

    /* Section Styling */
    .section-card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .section-title { font-size: 20px; font-weight: 600; color: var(--primary-color); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

    /* Book Cards Grid */
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
    .book-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-color: var(--primary-color); }
    
    .book-img { height: 140px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #94a3b8; }
    .book-info { padding: 12px; }
    .book-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: #0f172a; line-height: 1.3; }
    .book-category { font-size: 12px; background: #eff6ff; color: #2563eb; padding: 2px 8px; border-radius: 12px; display: inline-block; margin-bottom: 8px; }
    .book-price { font-size: 16px; font-weight: 700; color: #d97706; }

    .add-btn { width: 100%; background: var(--secondary-color); color: white; border: none; padding: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .add-btn:hover { background: #059669; }

    /* Cart & Checkout Sidebar */
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; font-size: 14px; }
    .total-box { font-size: 18px; font-weight: 700; color: var(--primary-color); display: flex; justify-content: space-between; margin-top: 15px; padding-top: 10px; border-top: 2px solid #e2e8f0; }

    .form-group { margin-top: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
    .form-control { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-control:focus { border-color: var(--primary-color); }

    .checkout-btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; margin-top: 20px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(30,58,138,0.2); }
    .checkout-btn:hover { background: #1e40af; }
  </style>
</head>
<body>

<div class="top-banner"><i class="fa-solid fa-truck"></i> Wholesale Educational Supplies for Schools in Chakwal & Surrounding Areas</div>

<header>
  <h1>Khurshid Kitab Ghar & Educational Services</h1>
  <p>Online Wholesale Portal for Quality Textbooks & Educational Supplies</p>
</header>

<div class="main-wrapper">
  
  <!-- Left Side: Book Catalogue -->
  <div class="section-card">
    <div class="section-title">
      <i class="fa-solid fa-book"></i> Book Catalogue
    </div>
    <div id="books-container" class="books-grid">
      <!-- Dynamic Content Loaded via JS -->
    </div>
  </div>

  <!-- Right Side: Cart & Checkout -->
  <div>
    <div class="section-card">
      <div class="section-title">
        <i class="fa-solid fa-cart-shopping"></i> Shopping Cart
      </div>
      <div id="cart-list">
        <p style="text-align: center; color: #94a3b8; font-size: 14px; padding: 20px 0;">No items selected.</p>
      </div>
      <div class="total-box">
        <span>Total Amount:</span>
        <span>Rs. <span id="total-amount">0</span></span>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">
        <i class="fa-solid fa-file-invoice"></i> School Details
      </div>
      <div class="form-group">
        <label>School Name & Branch</label>
        <input type="text" id="school-name" class="form-control" placeholder="e.g. M A Jinnah School Samanabad" required>
      </div>
      <div class="form-group">
        <label>WhatsApp Number</label>
        <input type="text" id="phone-number" class="form-control" placeholder="e.g. 923001234567" required>
      </div>
      <div class="form-group">
        <label>Payment Duration</label>
        <select id="payment-months" class="form-control">
          <option value="1 Month Period">1 Month Period</option>
          <option value="2 Months Period">2 Months Period</option>
          <option value="3 Months Period">3 Months Period</option>
          <option value="4 Months Period">4 Months Period</option>
        </select>
      </div>

      <button class="checkout-btn" onclick="submitOrder()">
        <i class="fa-brands fa-whatsapp"></i> Confirm Order via WhatsApp
      </button>
    </div>
  </div>

</div>

<script>
  let cart = [];
  let total = 0;

  async function fetchBooks() {
    try {
      const response = await fetch('/api/books');
      const data = await response.json();
      const container = document.getElementById('books-container');
      container.innerHTML = '';
      
      data.books.forEach(book => {
        container.innerHTML += `
          <div class="book-card">
            <div>
              <div class="book-img"><i class="fa-solid fa-book-open"></i></div>
              <div class="book-info">
                <span class="book-category">${book.category || 'School Book'}</span>
                <div class="book-title">${book.title}</div>
                <div class="book-price">Rs. ${book.price}</div>
              </div>
            </div>
            <button class="add-btn" onclick="addToCart('${book.title}', ${book.price})">
              <i class="fa-solid fa-cart-plus"></i> Add to Cart
            </button>
          </div>
        `;
      });
    } catch (e) {
      document.getElementById('books-container').innerText = 'Failed to load books catalog.';
    }
  }

  function addToCart(title, price) {
    cart.push({ title, price });
    total += price;
    updateCartUI();
  }

  function updateCartUI() {
    document.getElementById('total-amount').innerText = total;
    const cartList = document.getElementById('cart-list');
    if (cart.length === 0) {
      cartList.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 14px; padding: 20px 0;">No items selected.</p>';
      return;
    }
    cartList.innerHTML = cart.map(item => `
      <div class="cart-item">
        <span>${item.title}</span>
        <strong>Rs. ${item.price}</strong>
      </div>
    `).join('');
  }

  async function submitOrder() {
    const schoolName = document.getElementById('school-name').value.trim();
    const phone = document.getElementById('phone-number').value.trim();
    const paymentMonths = document.getElementById('payment-months').value;

    if (!schoolName || !phone || cart.length === 0) {
      alert('Please enter School Name, WhatsApp Number and select at least one item.');
      return;
    }

    try {
      const response = await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ schoolName, phone, items: cart, totalAmount: total, paymentMonths })
      });

      const result = await response.json();
      if (result.success) {
        window.open(result.whatsappUrl, '_blank');
      } else {
        alert('Failed to process order.');
      }
    } catch (error) {
      alert('Network error occurred.');
    }
  }

  fetchBooks();
</script>

</body>
</html>
